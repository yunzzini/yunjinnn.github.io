<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunjin Cho Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap');

        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: #212529;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 50px;
            padding-bottom: 50px;
        }

        /* 프로필 섹션 */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .profile-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #1a202c;
        }

        p.desc {
            color: var(--secondary-color);
            font-size: 1.05rem;
            margin: 0;
        }

        /* 메뉴 리스트 */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 22px;
            transition: all 0.2s ease-in-out;
        }

        .menu-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.08);
            transform: translateY(-2px);
        }

        .icon {
            font-size: 1.6rem;
            background-color: #f1f5f9;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .text h3 {
            margin: 0 0 6px 0;
            font-size: 1.15rem;
            color: #2d3748;
            font-weight: 700;
        }

        .text p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #a0aec0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="profile-badge">CHEMICAL & BIOLOGICAL ENGINEERING</div>
            <h1>Yunjin Cho</h1>
            <p class="desc">Research and Documentation Archive</p>
        </header>

        <nav class="menu-list">
            <a href="lab-lactic-acid.html" class="menu-item">
                <div class="icon">🔬</div>
                <div class="text">
                    <h3>Lab Log</h3>
                    <p>미생물 실험 및 블루라이트 연구 기록</p>
                </div>
            </a>

            <a href="library.html" class="menu-item">
                <div class="icon">📚</div>
                <div class="text">
                    <h3>Library</h3>
                    <p>문학과 과학 융합 탐구 및 독서록</p>
                </div>
            </a>

            <a href="sandbox.html" class="menu-item">
                <div class="icon">🛠️</div>
                <div class="text">
                    <h3>Sandbox</h3>
                    <p>자율 탐구 및 사이언스 프로젝트</p>
                </div>
            </a>
        </nav>

        <footer>
            <p>&copy; 2026 Yunjin Cho. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
